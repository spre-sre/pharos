name: Test Suite

on:
  push:  # all branches
  pull_request:
  workflow_dispatch:
  workflow_call:  # build-push.yml consumes this as a reusable workflow

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history: test_pinned_commit_is_valid_ancestor runs
          # `git merge-base --is-ancestor` against a pinned commit, which a
          # depth-1 shallow clone cannot resolve.
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Step 1 — read-only tripwire (fail-fast)
        run: PYTHONHASHSEED=0 python -m pytest tests/test_readonly_guard.py -q

      - name: Step 2 — full suite
        # shell: bash selects bash --noprofile --norc -eo pipefail {0}.
        # GHA's default run shell is bash -e {0} (NO pipefail): a failing pytest
        # piped into tee exits 0 and this step could never fail. pipefail is mandatory.
        shell: bash
        run: PYTHONHASHSEED=0 python -m pytest tests/ -q 2>&1 | tee pytest-out.txt

      - name: Step 3 — golden byte-stability gate
        # shell: bash for consistency with steps 2/4 and for the git-status check below.
        shell: bash
        run: |
          UPDATE_GOLDENS=1 PYTHONHASHSEED=0 python -m pytest tests/characterization -q
          git diff --exit-code tests/characterization/golden/
          test -z "$(git status --porcelain tests/characterization/golden/)"

      - name: Step 4 — zero-skipped assert
        # shell: bash for pipefail (same reason as step 2).
        # test -s ensures pytest-out.txt exists and is non-empty:
        # bare '! grep -q' on an absent file exits 0 — a gate that can never fail.
        shell: bash
        run: test -s pytest-out.txt && ! grep -qE '[0-9]+ skipped' pytest-out.txt
